name: Build Keychron B1 UK Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - b1-lily-port

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-wheel xz-utils file \
            make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install west
        run: |
          python3 -m pip install --user -U west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialise west workspace
        run: |
          west init -l app
          west update
          west zephyr-export

      - name: Install Python requirements
        run: |
          python3 -m pip install --user -r zephyr/scripts/requirements.txt
          python3 -m pip install --user -r app/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.15.2/zephyr-sdk-0.15.2_linux-x86_64.tar.gz
          tar xzf zephyr-sdk-0.15.2_linux-x86_64.tar.gz
          cd zephyr-sdk-0.15.2
          ./setup.sh -t arm-zephyr-eabi -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$GITHUB_WORKSPACE/zephyr-sdk-0.15.2" >> $GITHUB_ENV
          
      - name: Patch Zephyr BAS battery function
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zephyr/subsys/bluetooth/services/bas.c")
          text = path.read_text()

          if "bt_bas_set_battery_level_fix" in text:
              print("BAS fix already present")
              raise SystemExit(0)

          needle = """int bt_bas_set_battery_level(uint8_t level)
{
	int rc;

	if (level > 100U) {
		return -EINVAL;
	}

	battery_level = level;

	rc = bt_gatt_notify(NULL, &bas.attrs[1], &level, sizeof(level));

	return rc == -ENOTCONN ? 0 : rc;
}
"""

          insert = needle + """
int bt_bas_set_battery_level_fix(struct bt_conn *conn, uint8_t level)
{
	int rc;

	battery_level = level;
	if (level > 100U || conn == NULL) {
		if (level > 100U) {
			battery_level = 100;
		}
		return -EINVAL;
	}

	rc = bt_gatt_notify(conn, &bas.attrs[1], &level, sizeof(level));

	return rc == -ENOTCONN ? 0 : rc;
}
"""

          if needle not in text:
              raise SystemExit("Could not find bt_bas_set_battery_level block to patch")

          path.write_text(text.replace(needle, insert))
          print("Patched Zephyr BAS battery function")
          PY

      - name: Build B1 UK firmware
        run: |
          cd app
          west build -b keychron -p -- -DSHIELD=keychron_b1_uk

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keychron-b1-uk-firmware
          path: |
            app/build/zephyr/*.uf2
            app/build/zephyr/*.bin
            app/build/zephyr/*.hex